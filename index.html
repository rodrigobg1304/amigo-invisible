<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo invisible</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#165b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amigo Invisible">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
:root{--bg:#0c2a21;--fg:#f4efe4;--muted:#c3d4ca;--line:rgba(244,239,228,.22);--card:rgba(3,18,13,.6);--chip:rgba(244,239,228,.08);--accent:#c8102e;--accent-ink:#ffffff;--gold:#f2c14e;--snow:#f4efe4;color-scheme:dark}
body{margin:0 auto;max-width:560px;background:var(--fondo,var(--bg)) fixed;min-height:100%;color:var(--fg);font:400 15px/1.5 Manrope,system-ui,sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header,main{position:relative;z-index:1}
h1{font:700 26px/1.1 Fraunces,Georgia,serif;margin:0 0 6px;text-wrap:balance}
h2{font:600 19px/1.2 Fraunces,Georgia,serif;margin:0 0 8px}
.ribbon{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent));margin:0 0 4px}
.muted{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cab{display:flex;align-items:center;gap:14px;min-width:0}
.btn-av{position:relative;flex:none;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.btn-av .av{--s:64px;box-shadow:0 0 0 3px var(--gold)}
.btn-av .pastilla{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px/22px Manrope,sans-serif;text-align:center}
.btn-av:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-av[hidden]{display:none}
.menu-fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3}
.menu-fondo[hidden]{display:none}
.menu{position:fixed;top:0;bottom:0;left:0;width:min(300px,84%);box-sizing:border-box;background:var(--bg);color:var(--fg);z-index:4;transform:translateX(-105%);transition:transform .25s ease;display:flex;flex-direction:column;padding:20px 16px;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.3)}
.menu.abierto{transform:none}
.menu-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.menu-cab .fila{display:flex;align-items:center;gap:12px;min-width:0}
.menu nav{display:grid;gap:6px}
.menu nav button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;color:var(--fg);font:600 16px Manrope,sans-serif;padding:12px;cursor:pointer}
.menu nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.menu nav select{margin-bottom:10px}
.menu nav button:focus-visible,.menu .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.menu .pie{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.menu #btn-salir{width:100%;margin-top:0}
.menu #btn-salir[hidden]{display:none}
label{display:grid;gap:4px;font-weight:600;font-size:14px;margin:10px 0}
input,textarea,select{font:400 15px Manrope,sans-serif;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%;box-sizing:border-box}
textarea{min-height:84px;resize:vertical}
.clave{position:relative;display:block}
.clave input{padding-right:46px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:8px;cursor:pointer;border-radius:8px;display:grid;place-items:center;margin:0;width:auto}
.ojo:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.ojo .barra{display:none}
.ojo[aria-pressed="true"]{color:var(--gold)}
.ojo[aria-pressed="true"] .barra{display:inline}
.cf{margin:12px 0;min-height:65px}
.btn{font:700 15px Manrope,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 16px;cursor:pointer;margin-top:8px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{margin:0;padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--fg);border:2px solid var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.link{background:none;border:0;color:var(--gold);font:600 14px Manrope,sans-serif;cursor:pointer;padding:6px 0;text-decoration:underline;display:block}
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;color:#fff;font:700 calc(var(--s)*.42)/1 Fraunces,Georgia,serif;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.gift{font:700 24px Fraunces,Georgia,serif;margin:4px 0 0}
.regalo{display:block;width:150px;height:150px;margin:18px auto 8px;position:relative;border:0;background:none;cursor:pointer;padding:0}
.caja{position:absolute;left:20px;right:20px;top:44px;bottom:10px;background:var(--accent);border-radius:10px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.caja::before{content:"";position:absolute;left:50%;top:-18px;bottom:-6px;width:14px;margin-left:-7px;background:var(--gold);border-radius:3px}
.caja::after{content:"";position:absolute;top:50%;left:-6px;right:-6px;height:14px;margin-top:-7px;background:var(--gold);border-radius:3px}
.regalo.sacude .caja{animation:sacude .5s ease-in-out}
@keyframes sacude{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.regalo:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
.pista{text-align:center;color:var(--muted);margin:0 0 4px}
.revelado{text-align:center;animation:aparece .6s ease-out}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.revelado .av{--s:84px;margin:4px auto 0}
.ficha{margin:14px 0 0;display:grid;gap:10px;text-align:left}
.ficha dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ficha dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.list li > span:first-child{display:flex;align-items:center;gap:10px;min-width:0}
.row-end{display:flex;align-items:center;gap:8px;flex:none}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.part-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.part{text-align:center;min-width:0}
.part .av{--s:76px;margin:0 auto;box-shadow:0 0 0 3px var(--gold)}
.part strong{display:block;margin-top:8px;overflow-wrap:anywhere}
.part .muted{margin:2px 0 0;font-size:12px}
#toast{position:fixed;z-index:2;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;max-width:90%}
.aviso{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;box-sizing:border-box;z-index:5}
.aviso[hidden]{display:none}
.aviso-caja{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:340px;width:100%;box-sizing:border-box}
.aviso-caja .btn{width:100%;margin-top:12px}
.temas{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.tema-btn{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--fg);font-size:22px;line-height:1;cursor:pointer;padding:0}
.tema-btn[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--accent)}
.nieve{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.nieve span{position:absolute;top:-24px;color:var(--snow);opacity:.6;animation:cae linear infinite}
@keyframes cae{to{transform:translateY(110vh)}}
@media (prefers-reduced-motion:reduce){.nieve{display:none}.regalo.sacude .caja,.revelado{animation:none}.menu{transition:none}}
body[data-tema="nieve"]{--bg:#0b2545;--fondo:radial-gradient(circle at 20% 0%,#1d4f7a,#0b2545 65%);--fg:#f2f8ff;--muted:#bcd6ea;--line:rgba(242,248,255,.25);--card:rgba(6,22,44,.65);--chip:rgba(242,248,255,.09);--accent:#1e6fb8;--accent-ink:#ffffff;--gold:#bfe3ff;--snow:#ffffff}
body[data-tema="caramelo"]{--bg:#f7f2ea;--fondo:repeating-linear-gradient(135deg,rgba(179,24,46,.14) 0 28px,transparent 28px 56px),#f7f2ea;--fg:#3a0a12;--muted:#6e3340;--line:#d9a8a8;--card:#fffaf4;--chip:#f6e9e4;--accent:#b3182e;--accent-ink:#ffffff;--gold:#e9b949;--snow:#ffffff}
body[data-tema="galletas"]{--bg:#4a2c18;--fondo:radial-gradient(circle at 50% 0%,#7a4d2c,#3f2414 75%);--fg:#fbeccf;--muted:#e6cfa6;--line:rgba(251,236,207,.25);--card:rgba(28,14,5,.6);--chip:rgba(251,236,207,.08);--accent:#237046;--accent-ink:#ffffff;--gold:#f2c14e;--snow:#fbeccf}
body[data-tema="regalos"]{--bg:#7a1220;--fondo:linear-gradient(160deg,#a51b2a,#6a0d18);--fg:#fff3e0;--muted:#f5d6c8;--line:rgba(255,243,224,.28);--card:rgba(50,3,10,.6);--chip:rgba(255,243,224,.08);--accent:#f2c14e;--accent-ink:#3a0a10;--gold:#3f9a63;--snow:#fff3e0}
body[data-tema="pinos"]{--bg:#0a2a1d;--fondo:linear-gradient(180deg,#14533a,#0a2a1d);--fg:#f6f1e3;--muted:#c4dccb;--line:rgba(246,241,227,.22);--card:rgba(2,16,10,.6);--chip:rgba(246,241,227,.08);--accent:#c8102e;--accent-ink:#ffffff;--gold:#f2c14e;--snow:#f6f1e3}
body[data-tema="santa"]{--bg:#a30d1e;--fondo:linear-gradient(170deg,#e0132b 0%,#b00d20 55%,#7d0816 100%);--fg:#ffffff;--muted:#ffd6d6;--line:rgba(255,255,255,.45);--card:rgba(40,0,6,.55);--chip:rgba(255,255,255,.12);--accent:#111111;--accent-ink:#ffffff;--gold:#ffffff;--snow:#ffffff}
</style>
</head>
<body data-tema="nieve">

<header class="top">
  <div class="cab">
    <button class="btn-av" id="btn-menu" aria-label="Abrir menú" aria-controls="menu" aria-expanded="false" hidden></button>
    <div><h1>Amigo invisible</h1><p class="muted" id="sub">Cargando…</p></div>
  </div>
  <div class="row-end">
    <button class="btn ghost small" id="btn-instalar" onclick="pulsarInstalar()" hidden>📲 Instalar</button>
  </div>
</header>
<div class="ribbon" aria-hidden="true"></div>
<div class="temas" id="temas" role="group" aria-label="Fondo"></div>
<main id="app"><p class="empty">Cargando…</p></main>

<div class="menu-fondo" id="menu-fondo" hidden></div>
<aside class="menu" id="menu" inert aria-label="Menú de navegación">
  <div class="menu-cab">
    <div class="fila" id="menu-cab"></div>
    <button class="btn ghost small" id="btn-cerrar-menu" aria-label="Cerrar menú">✕</button>
  </div>
  <nav id="menu-nav"></nav>
  <div class="pie"><button class="btn ghost" id="btn-salir" hidden>Salir</button></div>
</aside>

<div class="aviso" id="aviso" hidden>
  <div class="aviso-caja" role="dialog" aria-modal="true" aria-labelledby="aviso-titulo" aria-describedby="aviso-texto">
    <h2 id="aviso-titulo"></h2>
    <p class="muted" id="aviso-texto" style="margin:0"></p>
    <button class="btn" id="aviso-ok">Aceptar</button>
  </div>
</div>

<div id="toast" hidden role="status"></div>
<div class="nieve" aria-hidden="true"></div>

<script>
const SB_URL="https://gfhzdadmovzybraqrobo.supabase.co";
const SB_KEY="sb_publishable_4hNS7q15MGEUBPXt9Gpkog_-2iADMBH";
const TURNSTILE_SITE_KEY="0x4AAAAAAFoKTlUSOT0sRn9X";
const sb=supabase.createClient(SB_URL,SB_KEY);

const TEMAS={
  nieve:{nombre:"Nieve",items:["❄"],tam:[8,18],icono:"❄"},
  caramelo:{nombre:"Bastones de caramelo",items:["🍭"],tam:[16,26],icono:"🍭"},
  galletas:{nombre:"Galletas de jengibre",items:["🍪"],tam:[16,26],icono:"🍪"},
  regalos:{nombre:"Regalos",items:["🎁"],tam:[16,26],icono:"🎁"},
  pinos:{nombre:"Pinos",items:["🌲"],tam:[16,26],icono:"🌲"},
  santa:{nombre:"Papá Noel",items:["🎅"],tam:[18,28],icono:"🎅"}
};
const COLORES=["#c8102e","#1f7a4d","#8a6310","#2d62a8","#8e3b8f"];

let yo=null, grupos=[], grupoId=null, screen="sorteo", anio=new Date().getFullYear(), modo="login",
    revelado=false, sacudiendo=false, confirmDraw=false, confirmReset=false, confirmDelete=null, confirmSalir=false;
try{grupoId=localStorage.getItem("amigo-grupo")||null}catch{}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const colorDe=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))>>>0;return COLORES[h%COLORES.length]};
const avatar=(p,tam)=>`<span class="av" style="${tam?`--s:${tam}px;`:""}background:${colorDe(p?.nombre||"?")}">${p?.foto_url?`<img src="${esc(p.foto_url)}" alt="">`:esc(String(p?.nombre||"?").charAt(0).toUpperCase())}</span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)}
function aviso(titulo,texto){
  $("#aviso-titulo").textContent=titulo;
  $("#aviso-texto").textContent=texto;
  $("#aviso").hidden=false;
  $("#aviso-ok").focus();
}
function cerrarAviso(){$("#aviso").hidden=true}
const errTxt=e=>e?.message||"Algo ha fallado. Inténtalo de nuevo.";
async function motivo(error){
  try{const j=await error.context.json();return j.error||errTxt(error)}catch{return errTxt(error)}
}

// Protección anti-bots (Cloudflare Turnstile)
const captcha=()=>`<div class="cf" data-captcha></div>`;
let intentosCaptcha=0;
function montarCaptcha(){
  if(!document.querySelector("[data-captcha]:not([data-wid])")) return;
  if(!window.turnstile){
    if(intentosCaptcha++<50) setTimeout(montarCaptcha,200);
    return;
  }
  document.querySelectorAll("[data-captcha]:not([data-wid])").forEach(el=>{
    el.dataset.wid=turnstile.render(el,{sitekey:TURNSTILE_SITE_KEY,theme:"auto"});
  });
}
// Devuelve el token de la verificación del formulario, o null si aún no está listo
function tokenDe(form){
  const el=form.querySelector("[data-captcha]");
  if(!el||!el.dataset.wid||!window.turnstile) return null;
  return turnstile.getResponse(el.dataset.wid)||null;
}
// El token sirve una sola vez: al terminar, se pide uno nuevo
function reiniciarCaptcha(form){
  const el=form.querySelector("[data-captcha]");
  if(el&&el.dataset.wid&&window.turnstile) turnstile.reset(el.dataset.wid);
}

// Campos de contraseña con ojo
const OJO=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="barra" x1="3" y1="3" x2="21" y2="21"/></svg>`;
const campoClave=(name,label,extra="")=>`<label>${label}<span class="clave"><input name="${name}" type="password" data-clave ${extra}><button type="button" class="ojo" data-ojo aria-label="Mostrar contraseña" aria-pressed="false">${OJO}</button></span></label>`;
function ocultarClaves(f){
  f.querySelectorAll("input[data-clave]").forEach(i=>i.type="password");
  f.querySelectorAll("[data-ojo]").forEach(b=>{b.setAttribute("aria-pressed","false");b.setAttribute("aria-label","Mostrar contraseña")});
}

// Grupo activo
const grupoActual=()=>grupos.find(g=>g.id===grupoId)||null;
const esOrganizador=()=>!!grupoActual()&&grupoActual().organizador_id===yo?.id;
function setGrupo(id){
  if(id===grupoId) return;
  grupoId=id;
  try{id?localStorage.setItem("amigo-grupo",id):localStorage.removeItem("amigo-grupo")}catch{}
  revelado=false; confirmDraw=false; confirmReset=false; confirmDelete=null;
}

// Instalación como app
let promptInstalar=null;
const yaInstalada=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function pintaInstalar(){
  const b=$("#btn-instalar");
  if(b) b.hidden=yaInstalada()||!(promptInstalar||esIOS());
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();promptInstalar=e;pintaInstalar()});
window.addEventListener("appinstalled",()=>{promptInstalar=null;pintaInstalar()});
function pulsarInstalar(){
  if(promptInstalar){promptInstalar.prompt();promptInstalar=null;pintaInstalar();return}
  alert("Para instalarla en el iPhone:\n1. Pulsa el botón Compartir de Safari.\n2. Elige \"Añadir a pantalla de inicio\".\n\nLa primera vez tendrás que volver a entrar con tu email y contraseña.");
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// Menú lateral
function setMenu(abrir){
  $("#menu").classList.toggle("abierto",abrir);
  $("#menu").inert=!abrir;
  $("#menu-fondo").hidden=!abrir;
  $("#btn-menu").setAttribute("aria-expanded",String(abrir));
}
function abrirMenu(abrir){
  setMenu(abrir);
  if(abrir){($("#menu [aria-current='true']")||$("#btn-cerrar-menu")).focus()}
  else if(!$("#btn-menu").hidden){$("#btn-menu").focus()}
}
function menuNav(){
  const selector=grupos.length
    ?`<label>Grupo activo<select data-action="grupo">${grupos.map(x=>`<option value="${esc(x.id)}" ${x.id===grupoId?"selected":""}>${esc(x.nombre)}</option>`).join("")}</select></label>`
    :"";
  const lista=[
    ["grupos","Mis grupos"],
    ...(grupoActual()?[["sorteo","Mi sorteo"],["participantes","Participantes"],["historial","Historial"]]:[]),
    ["perfil","Mi perfil"],
    ...(esOrganizador()?[["organizador","Organizador"]]:[])
  ];
  return selector+lista.map(([k,l])=>`<button data-screen="${k}" aria-current="${screen===k}">${l}</button>`).join("");
}

// Temas
function pintaFondo(tema){
  const t=TEMAS[tema]?tema:"nieve", T=TEMAS[t], n=document.querySelector(".nieve");
  document.body.dataset.tema=t;
  document.querySelectorAll("[data-tema-pick]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.temaPick===t)));
  n.replaceChildren();
  for(let i=0;i<16;i++){
    const s=document.createElement("span");
    s.style.left=(Math.random()*100)+"%";
    s.style.animationDuration=(9+Math.random()*10)+"s";
    s.style.animationDelay=(-Math.random()*15)+"s";
    s.style.fontSize=(T.tam[0]+Math.random()*(T.tam[1]-T.tam[0]))+"px";
    s.textContent=T.items[i%T.items.length];
    n.appendChild(s);
  }
  try{localStorage.setItem("amigo-tema",t)}catch{}
}
(()=>{
  $("#temas").innerHTML=Object.entries(TEMAS).map(([k,t])=>`<button class="tema-btn" data-tema-pick="${k}" aria-label="${t.nombre}" title="${t.nombre}" aria-pressed="false">${t.icono}</button>`).join("");
  let t="nieve"; try{t=localStorage.getItem("amigo-tema")||"nieve"}catch{}
  pintaFondo(t);
})();

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tema-pick]");
  if(b) pintaFondo(b.dataset.temaPick);
});

// Vistas de acceso
function vistaLogin(){
  return `<section class="card"><h2>Entrar</h2>
    <form id="f-login"><label>Email<input name="email" type="email" required autocomplete="username"></label>
    ${campoClave("password","Contraseña",'required autocomplete="current-password"')}
    ${captcha()}
    <button class="btn" type="submit">Entrar</button></form>
    <button class="link" id="olvide">He olvidado mi contraseña</button>
    <button class="link" id="ir-registro">Crear una cuenta nueva</button></section>`;
}
function vistaRecuperar(){

// Vistas de la app

function yearPicker(){

function ficha(p){return `<dl class="ficha"><dt>Gustos</dt><dd>${esc(p.gustos)||"—"}</dd><dt>Tallas</dt><dd>${esc(p.tallas)||"—"}</dd><dt>Deseos</dt><dd>${esc(p.deseos)||"—"}</dd></dl>`}

async function vistaSorteo(){
  const g=grupoActual();
  const {data:hecho}=await sb.rpc("sorteo_hecho",{p_grupo:g.id,p_anio:anio});
  let card;
  if(!hecho) card=`<h2>Sorteo ${anio}</h2><p class="muted">Todavía no se ha hecho. Cuando el organizador lo lance, aquí verás a quién te toca regalar.</p>`;
  else{
    const {data,error}=await sb.rpc("mi_regalo",{p_grupo:g.id,p_anio:anio});
    const to=!error&&data?.[0];
    if(!to) card=`<p class="muted">No apareces en el sorteo de ${anio}.</p>`;
    else if(!revelado) card=`<p class="pista">Toca el regalo para descubrir a quién te toca</p><button class="regalo ${sacudiendo?"sacude":""}" data-action="abrir" aria-label="Abrir regalo"><span class="caja"></span></button>`;
    else card=`<div class="revelado"><p class="muted">Solo tú ves esto</p>${avatar(to,84)}<h2 style="margin-top:10px">Te toca regalar a</h2><p class="gift">${esc(to.nombre)}</p>${ficha(to)}</div>`;
  }
  const dias=(()=>{const h=new Date();let n=new Date(h.getFullYear(),11,25);if(n<h)n=new Date(h.getFullYear()+1,11,25);return Math.ceil((n-h)/864e5)})();
  return `${yearPicker()}<p class="muted">${esc(g.nombre)} · faltan ${dias} días para Navidad</p><section class="card">${card}</section>`;
}

async function vistaOrganizador(){
  const g=grupoActual();
  const {data:hecho}=await sb.rpc("sorteo_hecho",{p_grupo:g.id,p_anio:anio});
  const {data:personas,error}=await sb.rpc("listar_miembros",{p_grupo:g.id});

        ${campoClave("password","Contraseña temporal (solo si no tiene cuenta)",'minlength="8" autocomplete="off"')}

// Salir (primer toque pide confirmación)
async function salir(){
  if(!confirmSalir){confirmSalir=true;return render()}
  confirmSalir=false;
  const {error}=await sb.auth.signOut();
  if(error) toast(errTxt(error));
  yo=null; grupos=[]; modo="login"; screen="sorteo";
  revelado=false; confirmDraw=false; confirmReset=false; confirmDelete=null;
  return render();
}

// Render
async function render(){
  const app=$("#app");
  const pinta=html=>{app.innerHTML=html;montarCaptcha()};
  const logueado=!!yo;
  const enApp=logueado&&modo!=="nueva";
  const bs=$("#btn-salir");
  bs.hidden=!logueado;
  bs.textContent=confirmSalir?"¿Seguro?":"Salir";
  $("#btn-menu").hidden=!enApp;
  pintaInstalar();
  if(!enApp){setMenu(false);$("#menu-cab").innerHTML="";$("#menu-nav").innerHTML=""}
  if(modo==="nueva"){$("#sub").textContent="Cambia tu contraseña";pinta(vistaNuevaClave());return}
  if(!logueado&&modo==="registro"){$("#sub").textContent="Crear cuenta";pinta(vistaRegistro());return}
  if(!logueado&&modo==="recuperar"){$("#sub").textContent="Recuperar contraseña";pinta(vistaRecuperar());return}
  if(!logueado){$("#sub").textContent="Entrar";pinta(vistaLogin());return}
  if(!yo.nombre){
    $("#btn-menu").innerHTML=avatar(yo,64)+'<span class="pastilla">☰</span>';
    $("#menu-cab").innerHTML="";$("#menu-nav").innerHTML="";
    pinta(vistaSinPerfil());return;
  }
  const g=grupoActual();
  $("#sub").textContent=`Hola, ${yo.nombre}${g?` · ${g.nombre}`:""}`;
  // Sin grupo activo, solo tiene sentido Mis grupos y Mi perfil
  if(!g&&screen!=="grupos"&&screen!=="perfil") screen="grupos";
  if(screen==="organizador"&&!esOrganizador()) screen="sorteo";
  $("#btn-menu").innerHTML=avatar(yo,64)+'<span class="pastilla" aria-hidden="true">☰</span>';
  $("#menu-cab").innerHTML=`${avatar(yo,56)}<div><strong>${esc(yo.nombre)}</strong></div>`;
  $("#menu-nav").innerHTML=menuNav();
  let cuerpo="";
  if(screen==="grupos") cuerpo=vistaGrupos();
  else if(screen==="sorteo") cuerpo=await vistaSorteo();
  else if(screen==="participantes") cuerpo=await vistaParticipantes();
  else if(screen==="perfil") cuerpo=vistaPerfil();
  else if(screen==="historial") cuerpo=await vistaHistorial();
  else if(screen==="organizador") cuerpo=await vistaOrganizador();
  pinta(cuerpo);
}

// Carga de datos del usuario y sus grupos
async function cargarYo(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){yo=null;grupos=[];return}
  const {data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  yo=data||{nombre:"",id:session.user.id};
  const {data:gs}=await sb.from("grupos").select("id,nombre,organizador_id").order("nombre");
  grupos=gs||[];
  if(!grupos.some(g=>g.id===grupoId)) setGrupo(grupos[0]?.id||null);
}

// Acciones
document.addEventListener("click",async e=>{
  if(e.target.closest("#btn-menu")){abrirMenu(true);return}
  if(e.target.closest("#btn-cerrar-menu")||e.target.id==="menu-fondo"){abrirMenu(false);return}
  if(e.target.closest("#aviso-ok")||e.target.id==="aviso"){cerrarAviso();return}
  if(e.target.closest("#ir-registro")){modo="registro";return render()}
  if(e.target.closest("#ir-login")){modo="login";return render()}
  if(e.target.closest("#olvide")){modo="recuperar";return render()}
  const ojo=e.target.closest("[data-ojo]");
  if(ojo){
    const inp=ojo.parentElement.querySelector("input");
    const mostrar=inp.type==="password";
    inp.type=mostrar?"text":"password";
    ojo.setAttribute("aria-pressed",String(mostrar));
    ojo.setAttribute("aria-label",mostrar?"Ocultar contraseña":"Mostrar contraseña");
    return;
  }
  const gr=e.target.closest("[data-grupo]");
  if(gr){setGrupo(gr.dataset.grupo);screen="sorteo";return render()}
  const sc=e.target.closest("[data-screen]"), act=e.target.closest("[data-action]");
  if(sc){screen=sc.dataset.screen;confirmSalir=false;confirmDraw=false;confirmReset=false;revelado=false;abrirMenu(false);return render()}
  if(e.target.closest("#btn-salir")){return salir()}
  if(e.target.closest("#btn-cancelar")){confirmSalir=false;return salir()}
  if(!act)return;
  const a=act.dataset.action;
  if(a==="abrir"&&!sacudiendo&&!revelado){sacudiendo=true;await render();setTimeout(async()=>{sacudiendo=false;revelado=true;await render()},520)}
  if(a==="sortear"){
    if(!confirmDraw){confirmDraw=true;return render()}
    confirmDraw=false;
    const {error}=await sb.rpc("sortear",{p_grupo:grupoId,p_anio:anio});
    if(error){aviso("No se ha podido hacer el sorteo",errTxt(error));return render()}
    toast("Sorteo hecho");return render();
  }
  if(a==="reset"){
    if(!confirmReset){confirmReset=true;return render()}
    confirmReset=false;
    const {error}=await sb.rpc("borrar_sorteo",{p_grupo:grupoId,p_anio:anio});
    if(error){aviso("No se ha podido borrar el sorteo",errTxt(error));return render()}
    toast("Sorteo borrado. Ya puedes volver a hacerlo.");return render();
  }
  if(a==="quitar"){
    const id=act.dataset.id;
    if(confirmDelete!==id){confirmDelete=id;return render()}
    confirmDelete=null;
    const {error}=await sb.rpc("quitar_miembro",{p_grupo:grupoId,p_profile:id});
    if(error){aviso("No se ha podido quitar a esa persona",errTxt(error));return render()}
    toast("Persona quitada del grupo");return render();
  }
});

// Escape cierra el aviso o el menú
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(!$("#aviso").hidden){cerrarAviso();return}
  if($("#menu").classList.contains("abierto"))abrirMenu(false);
});

document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.matches('[data-action="anyo"]')){anio=+t.value;confirmDraw=false;confirmReset=false;revelado=false;return render()}
  if(t.matches('[data-action="grupo"]')){setGrupo(t.value);screen="sorteo";abrirMenu(false);return render()}
  if(t.matches("[data-foto-propia]")){
    const file=t.files?.[0]; if(!file)return;
    if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){aviso("Formato no válido","Elige una imagen JPG, PNG, WEBP o GIF.");t.value="";return}
    if(file.size>2*1024*1024){aviso("La imagen es demasiado grande","El máximo es de 2 MB.");t.value="";return}
    const ext=file.type.split("/")[1].replace("jpeg","jpg");
    const ruta=`${yo.id}/${Date.now()}.${ext}`;
    const {error:errUp}=await sb.storage.from("fotos").upload(ruta,file,{upsert:false,contentType:file.type});
    if(errUp){aviso("No se ha podido subir la foto",errTxt(errUp));return}
    const url=sb.storage.from("fotos").getPublicUrl(ruta).data.publicUrl;
    const {error}=await sb.from("profiles").update({foto_url:url}).eq("id",yo.id);
    if(error){aviso("No se ha podido guardar la foto",errTxt(error));return}
    toast("Foto actualizada");
    await cargarYo();
    return render();
  }
});

document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target, fd=new FormData(f);

  // Formularios protegidos por Turnstile
  if(f.id==="f-login"||f.id==="f-recuperar"||f.id==="f-registro"){
    const token=tokenDe(f);
    if(!token){toast("Espera un momento: se está comprobando que no eres un robot.");return}
    if(f.id==="f-login"){
      const {error}=await sb.auth.signInWithPassword({
        email:String(fd.get("email")).trim(),
        password:String(fd.get("password")),
        options:{captchaToken:token}
      });
      reiniciarCaptcha(f);
      if(error) toast(/invalid/i.test(error.message)?"Email o contraseña incorrectos.":errTxt(error));
      return;
    }
    if(f.id==="f-recuperar"){
      const {error}=await sb.auth.resetPasswordForEmail(String(fd.get("email")).trim(),{
        redirectTo:location.href.split("#")[0],
        captchaToken:token
      });
      reiniciarCaptcha(f);
      if(error){aviso("No se ha podido enviar",errTxt(error));return}
      aviso("Revisa tu correo","Si el email existe, te llegará un enlace para cambiar la contraseña.");
      return;
    }
    // f-registro
    if(fd.get("password")!==fd.get("repite")){reiniciarCaptcha(f);aviso("Las contraseñas no coinciden","Escribe la misma contraseña en los dos campos.");return}
    const {data,error}=await sb.auth.signUp({
      email:String(fd.get("email")).trim(),
      password:String(fd.get("password")),
      options:{
        data:{nombre:String(fd.get("nombre")).trim()},
        captchaToken:token,
        emailRedirectTo:"https://rodrigobg1304.github.io/amigo-invisible/"
      }
    });
    reiniciarCaptcha(f);
    if(error){aviso("No se ha podido crear la cuenta",errTxt(error));return}
    modo="login";
    if(data.session) return;   // ya ha entrado; el evento de sesión se encarga
    aviso("Revisa tu correo","Te hemos enviado un enlace para confirmar tu cuenta. Después, entra con tu email y contraseña.");
    return render();
  }

  if(f.id==="f-clave"){
    if(fd.get("password")!==fd.get("repite")){aviso("Las contraseñas no coinciden","Escribe la misma contraseña en los dos campos.");return}
    const {error}=await sb.auth.updateUser({password:String(fd.get("password"))});
    if(error){aviso("No se ha podido guardar",errTxt(error));return}
    modo="app";
    aviso("Contraseña cambiada con éxito","Ya puedes usar tu nueva contraseña.");
    await cargarYo(); return render();
  }
  if(f.id==="f-cambiar"){
    if(fd.get("password")!==fd.get("repite")){aviso("Las contraseñas no coinciden","Escribe la misma contraseña en los dos campos.");return}
    const {error}=await sb.auth.updateUser({password:String(fd.get("password"))});
    if(error){aviso("No se ha podido cambiar",errTxt(error));return}
    aviso("Contraseña cambiada con éxito","Ya puedes usar tu nueva contraseña.");
    f.reset(); ocultarClaves(f); return;
  }
  if(f.id==="f-perfil"){
    const {error}=await sb.from("profiles").update({
      nombre:String(fd.get("nombre")).trim()||yo.nombre,
      gustos:String(fd.get("gustos")).trim(),
      tallas:String(fd.get("tallas")).trim(),
      deseos:String(fd.get("deseos")).trim()
    }).eq("id",yo.id);
    toast(error?errTxt(error):"Guardado");
    if(!error){await cargarYo()}
    return render();
  }
  if(f.id==="f-crear-grupo"){
    const {data,error}=await sb.rpc("crear_grupo",{p_nombre:String(fd.get("nombre")).trim()});
    if(error){aviso("No se ha podido crear el grupo",errTxt(error));return}
    await cargarYo();
    setGrupo(data);
    screen="organizador";
    toast("Grupo creado. Ya puedes añadir personas.");
    return render();
  }
  if(f.id==="f-nueva"){
    const body={
      accion:"anadir",
      grupo_id:grupoId,
      email:String(fd.get("email")).trim(),
      nombre:String(fd.get("nombre")).trim(),
      password:String(fd.get("password"))
    };
    const {data,error}=await sb.functions.invoke("gestionar-personas",{body});
    if(error){aviso("No se ha podido añadir",await motivo(error));return}
    if(data?.nueva) aviso("Cuenta creada","Pásale su email y su contraseña temporal. Podrá cambiarla desde Mi perfil.");
    else toast("Añadido/a al grupo");
    f.reset(); ocultarClaves(f); return render();
  }
});

// Al entrar, salir o cambiar de sesión (incluida la recuperación de contraseña)
// Se difiere con setTimeout: llamar a Supabase dentro del propio callback puede bloquear la sesión
sb.auth.onAuthStateChange((evento)=>{
  setTimeout(async()=>{
    if(evento==="PASSWORD_RECOVERY"){modo="nueva"}
    else if(evento==="SIGNED_OUT"){modo="login"}
    else if(evento==="SIGNED_IN" && modo!=="nueva"){modo="app"}
    await cargarYo();
    render();
  },0);
});
